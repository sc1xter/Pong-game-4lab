<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong — Главная</title>
    <link rel="icon" type="image/png" href="img/favicon.png" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="container">
        <div class="game-title">🏓 P<span>o</span>ng</div>

        <div class="game-description">
            Классическая аркада <span class="highlight">на двоих</span>.<br>
            Отбивайте мяч ракетками, набирайте очки и побеждайте!
        </div>

        <nav class="menu">
            <a class="menu-btn play-btn" href="game.html">
                <span class="icon">▶</span> Играть
            </a>
            <a class="menu-btn leader-btn" href="leaderboard.html">
                <span class="icon">🏆</span> Таблица лидеров
            </a>
            <a class="menu-btn settings-btn" href="settings.html">
                <span class="icon">⚙</span> Настройки
            </a>
        </nav>

        <p class="page-note">
            Pong — одна из первых видеоигр в истории (1972, Atari).
            Управление: <kbd>W</kbd>/<kbd>S</kbd> — левая ракетка,
            <kbd>↑</kbd>/<kbd>↓</kbd> — правая.
        </p>
    </div>
    <script src="js/theme.js"></script>
